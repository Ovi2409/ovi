<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Submissions Admin 💕</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Admin-specific styles */
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-header h1 {
            font-size: 2.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .admin-header p {
            color: var(--text-light);
            font-size: 1.1rem;
        }

        .search-container {
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            max-width: 500px;
            padding: 16px 24px;
            font-size: 1rem;
            font-family: inherit;
            border: 2px solid var(--primary-pink);
            border-radius: 50px;
            background: white;
            color: var(--text-dark);
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: #FF9AAB;
            box-shadow: 0 0 0 4px rgba(255, 182, 193, 0.2);
        }

        .table-container {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 8px 32px var(--shadow);
            overflow-x: auto;
        }

        .submissions-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .submissions-table th,
        .submissions-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 182, 193, 0.3);
        }

        .submissions-table th {
            background: linear-gradient(135deg, var(--primary-pink) 0%, #FF9AAB 100%);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: sticky;
            top: 0;
        }

        .submissions-table th:first-child {
            border-radius: 12px 0 0 0;
        }

        .submissions-table th:last-child {
            border-radius: 0 12px 0 0;
        }

        .submissions-table tr:hover {
            background: var(--light-pink);
        }

        .submissions-table td {
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .delete-btn {
            background: linear-gradient(135deg, #FF6B6B 0%, #FF4757 100%);
            color: white;
            border: none;
            padding: 8px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: var(--transition);
        }

        .delete-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.4);
        }

        .delete-btn:active {
            transform: translateY(0);
        }

        .no-submissions {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .no-submissions .emoji {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
        }

        .loading-spinner {
            text-align: center;
            padding: 60px 20px;
        }

        .loading-spinner .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 182, 193, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary-pink);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--primary-pink) 0%, #FF9AAB 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: var(--transition);
        }

        .back-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.4);
        }

        /* Responsive table */
        @media (max-width: 768px) {
            .admin-header h1 {
                font-size: 1.8rem;
            }

            .table-container {
                padding: 15px;
            }

            .submissions-table th,
            .submissions-table td {
                padding: 12px 8px;
                font-size: 0.85rem;
            }

            .delete-btn {
                padding: 6px 12px;
                font-size: 0.8rem;
            }
        }

        /* Empty state styling */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        .empty-state h3 {
            font-size: 1.5rem;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .empty-state p {
            color: var(--text-light);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <!-- Floating hearts background -->
    <div class="hearts-background">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <div class="admin-container">
        <div class="admin-header">
            <h1>💕 Date Submissions Admin</h1>
            <p>View and manage all date requests</p>
        </div>

        <!-- Search bar -->
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput" 
                placeholder="Search by food, message, or date..."
            >
        </div>

        <!-- Table container -->
        <div class="table-container">
            <div id="loadingState" class="loading-spinner">
                <div class="spinner"></div>
                <p>Loading submissions...</p>
            </div>

            <div id="emptyState" class="empty-state" style="display: none;">
                <span class="icon">💌</span>
                <h3>No submissions yet</h3>
                <p>Wait for someone to say yes! 💕</p>
            </div>

            <div id="tableContent" style="display: none;">
                <table class="submissions-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Food</th>
                            <th>Message</th>
                            <th>Timestamp</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="submissionsBody">
                        <!-- Submissions will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="index.html" class="back-link">← Back to Date Invitation</a>
        </div>
    </div>

    <!-- Load Firebase configuration -->
    <script type="module" src="firebase.js"></script>
    <!-- Load admin functionality -->
    <script type="module" src="admin.js"></script>
</body>
</html>
